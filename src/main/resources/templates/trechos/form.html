<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${trecho.id == null ? 'Novo trecho' : 'Editar trecho'}">Formulário de Trecho</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f3f7f9; font-family: 'Segoe UI', system-ui, sans-serif; }
        .navbar-custom { background: linear-gradient(135deg, #0b3948 0%, #15616d 100%); }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark navbar-custom shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">Cidade em Dia de Chuva</a>
        <div class="collapse navbar-collapse show">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Início</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/bairros}">Bairros</a></li>
                <li class="nav-item"><a class="nav-link active" th:href="@{/trechos}">Trechos</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/leituras}">Leituras</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container pb-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h4 fw-bold mb-3" th:text="${trecho.id == null ? 'Novo trecho' : 'Editar trecho'}">Trecho</h1>

                    <form th:action="@{/trechos/salvar}" th:object="${trecho}" method="post" novalidate>
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label for="logradouro" class="form-label fw-semibold">Logradouro</label>
                            <input type="text" id="logradouro" th:field="*{logradouro}" class="form-control"
                                   th:classappend="${#fields.hasErrors('logradouro')} ? 'is-invalid'"
                                   placeholder="Ex.: Rua do Córrego">
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('logradouro')}" th:errors="*{logradouro}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="bairroId" class="form-label fw-semibold">Bairro</label>
                            <select id="bairroId" th:field="*{bairroId}" class="form-select"
                                    th:classappend="${#fields.hasErrors('bairroId')} ? 'is-invalid'">
                                <option value="">Selecione...</option>
                                <option th:each="b : ${bairros}" th:value="${b.id}" th:text="${b.nome}"></option>
                            </select>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('bairroId')}" th:errors="*{bairroId}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="tipoCalcada" class="form-label fw-semibold">Tipo de calçada</label>
                            <select id="tipoCalcada" th:field="*{tipoCalcada}" class="form-select"
                                    th:classappend="${#fields.hasErrors('tipoCalcada')} ? 'is-invalid'">
                                <option value="">Selecione...</option>
                                <option th:each="tc : ${tiposCalcada}" th:value="${tc}" th:text="${tc}"></option>
                            </select>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('tipoCalcada')}" th:errors="*{tipoCalcada}"></div>
                        </div>

                        <div class="mb-4">
                            <label for="altitude" class="form-label fw-semibold">Altitude (m)</label>
                            <input type="number" id="altitude" th:field="*{altitude}" class="form-control"
                                   th:classappend="${#fields.hasErrors('altitude')} ? 'is-invalid'"
                                   placeholder="Entre 0 e 2000">
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('altitude')}" th:errors="*{altitude}"></div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Salvar</button>
                            <a th:href="@{/trechos}" class="btn btn-outline-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
