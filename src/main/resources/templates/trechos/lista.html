<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trechos de calçada — Cidade em Dia de Chuva</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f3f7f9; font-family: 'Segoe UI', system-ui, sans-serif; }
        .navbar-custom { background: linear-gradient(135deg, #0b3948 0%, #15616d 100%); }
        .table-header-custom th { background-color: #0b3948; color: #ffffff; font-weight: 600; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark navbar-custom shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">Cidade em Dia de Chuva</a>
        <div class="collapse navbar-collapse show">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Início</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/bairros}">Bairros</a></li>
                <li class="nav-item"><a class="nav-link active" th:href="@{/trechos}">Trechos</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/leituras}">Leituras</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container pb-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h1 class="h3 fw-bold mb-1">Trechos de calçada</h1>
            <p class="text-secondary small mb-0">Ordenados por logradouro de A a Z (Parâmetro P4 = 0)</p>
        </div>
        <a th:href="@{/trechos/novo}" class="btn btn-primary">+ Novo trecho</a>
    </div>

    <div th:if="${mensagemSucesso}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${mensagemSucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${mensagemErro}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${mensagemErro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-header-custom">
                    <tr>
                        <th class="ps-3">Logradouro</th>
                        <th>Bairro</th>
                        <th>Tipo de calçada</th>
                        <th>Altitude (m)</th>
                        <th class="text-end pe-3">Ações</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(trechos)}">
                        <td colspan="5" class="text-center text-secondary py-4">Nenhum trecho cadastrado.</td>
                    </tr>
                    <tr th:each="t : ${trechos}">
                        <td class="ps-3 fw-semibold" th:text="${t.logradouro}"></td>
                        <td th:text="${t.bairroNome}"></td>
                        <td th:text="${t.tipoCalcada}"></td>
                        <td th:text="${t.altitude}"></td>
                        <td class="text-end pe-3">
                            <div class="d-inline-flex gap-2 align-items-center">
                                <a th:href="@{/trechos/{id}/editar(id=${t.id})}" class="btn btn-sm btn-outline-primary">Editar</a>
                                <form th:action="@{/trechos/{id}/excluir(id=${t.id})}" method="post" class="d-inline"
                                      onsubmit="return confirm('Deseja realmente excluir este trecho?');">
                                    <button type="submit" class="btn btn-sm btn-danger">Excluir</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
