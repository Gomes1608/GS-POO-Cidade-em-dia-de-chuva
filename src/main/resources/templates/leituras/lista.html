<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leituras — Cidade em Dia de Chuva</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f3f7f9; font-family: 'Segoe UI', system-ui, sans-serif; }
        .navbar-custom { background: linear-gradient(135deg, #0b3948 0%, #15616d 100%); }
        .table-header-custom th { background-color: #0b3948; color: #ffffff; font-weight: 600; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark navbar-custom shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">Cidade em Dia de Chuva</a>
        <div class="collapse navbar-collapse show">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Início</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/bairros}">Bairros</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/trechos}">Trechos</a></li>
                <li class="nav-item"><a class="nav-link active" th:href="@{/leituras}">Leituras</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container pb-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h1 class="h3 fw-bold mb-1">Leituras</h1>
            <p class="text-secondary small mb-0">
                Da mais recente para a mais antiga · Limiar L = <strong th:text="${limiarAlerta + ' cm'}">10 cm</strong>
                (Atenção a partir de <strong th:text="${limiarAtencao + ' cm'}">5 cm</strong>)
            </p>
        </div>
        <a th:href="@{/leituras/novo}" class="btn btn-primary">+ Nova leitura</a>
    </div>

    <div th:if="${mensagemSucesso}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${mensagemSucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${mensagemErro}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${mensagemErro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-header-custom">
                    <tr>
                        <th class="ps-3">Data e hora</th>
                        <th>Trecho</th>
                        <th>Lâmina (cm)</th>
                        <th>Status</th>
                        <th class="text-end pe-3">Ações</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(leituras)}">
                        <td colspan="5" class="text-center text-secondary py-4">Nenhuma leitura registrada.</td>
                    </tr>
                    <tr th:each="l : ${leituras}">
                        <td class="ps-3" th:text="${#temporals.format(l.dataHora, 'dd/MM/yyyy HH:mm')}"></td>
                        <td class="fw-semibold" th:text="${l.trechoLogradouro}"></td>
                        <td th:text="${l.laminaCm}"></td>
                        <td>
                            <span th:if="${l.status == 'NORMAL'}" class="badge bg-success-subtle text-success-emphasis">NORMAL</span>
                            <span th:if="${l.status == 'ATENCAO'}" class="badge bg-warning-subtle text-warning-emphasis">ATENCAO</span>
                            <span th:if="${l.status == 'ALERTA'}" class="badge bg-danger-subtle text-danger-emphasis">ALERTA</span>
                        </td>
                        <td class="text-end pe-3">
                            <div class="d-inline-flex gap-2 align-items-center">
                                <a th:href="@{/leituras/{id}/editar(id=${l.id})}" class="btn btn-sm btn-outline-primary">Editar</a>
                                <form th:action="@{/leituras/{id}/excluir(id=${l.id})}" method="post" class="d-inline"
                                      onsubmit="return confirm('Deseja realmente excluir esta leitura?');">
                                    <button type="submit" class="btn btn-sm btn-danger">Excluir</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
