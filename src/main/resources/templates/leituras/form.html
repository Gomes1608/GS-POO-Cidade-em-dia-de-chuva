<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${leitura.id == null ? 'Nova leitura' : 'Editar leitura'}">Formulário de Leitura</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f3f7f9; font-family: 'Segoe UI', system-ui, sans-serif; }
        .navbar-custom { background: linear-gradient(135deg, #0b3948 0%, #15616d 100%); }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark navbar-custom shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">Cidade em Dia de Chuva</a>
        <div class="collapse navbar-collapse show">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Início</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/bairros}">Bairros</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/trechos}">Trechos</a></li>
                <li class="nav-item"><a class="nav-link active" th:href="@{/leituras}">Leituras</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container pb-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h4 fw-bold mb-3" th:text="${leitura.id == null ? 'Nova leitura' : 'Editar leitura'}">Leitura</h1>

                    <form th:action="@{/leituras/salvar}" th:object="${leitura}" method="post" novalidate>
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label for="trechoId" class="form-label fw-semibold">Trecho</label>
                            <select id="trechoId" th:field="*{trechoId}" class="form-select"
                                    th:classappend="${#fields.hasErrors('trechoId')} ? 'is-invalid'">
                                <option value="">Selecione...</option>
                                <option th:each="t : ${trechos}" th:value="${t.id}"
                                        th:text="${t.logradouro + ' (' + t.bairroNome + ')'}"></option>
                            </select>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('trechoId')}" th:errors="*{trechoId}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="dataHora" class="form-label fw-semibold">Data e hora</label>
                            <input type="datetime-local" id="dataHora" th:field="*{dataHora}" class="form-control"
                                   th:classappend="${#fields.hasErrors('dataHora')} ? 'is-invalid'">
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('dataHora')}" th:errors="*{dataHora}"></div>
                        </div>

                        <div class="mb-4">
                            <label for="laminaCm" class="form-label fw-semibold">Lâmina de água (cm)</label>
                            <input type="number" id="laminaCm" th:field="*{laminaCm}" class="form-control"
                                   th:classappend="${#fields.hasErrors('laminaCm')} ? 'is-invalid'"
                                   placeholder="Entre 0 e 300">
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('laminaCm')}" th:errors="*{laminaCm}"></div>
                            <div class="form-text">
                                O status (<code>NORMAL</code>, <code>ATENCAO</code> ou <code>ALERTA</code>) é calculado automaticamente ao salvar (L = <span th:text="${limiarAlerta}">10</span> cm).
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Salvar</button>
                            <a th:href="@{/leituras}" class="btn btn-outline-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
