<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${bairro.id == null ? 'Novo bairro' : 'Editar bairro'}">Formulário de Bairro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f3f7f9; font-family: 'Segoe UI', system-ui, sans-serif; }
        .navbar-custom { background: linear-gradient(135deg, #0b3948 0%, #15616d 100%); }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark navbar-custom shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">Cidade em Dia de Chuva</a>
        <div class="collapse navbar-collapse show">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Início</a></li>
                <li class="nav-item"><a class="nav-link active" th:href="@{/bairros}">Bairros</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/trechos}">Trechos</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/leituras}">Leituras</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container pb-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h4 fw-bold mb-3" th:text="${bairro.id == null ? 'Novo bairro' : 'Editar bairro'}">Bairro</h1>

                    <form th:action="@{/bairros/salvar}" th:object="${bairro}" method="post" novalidate>
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label for="nome" class="form-label fw-semibold">Nome</label>
                            <input type="text" id="nome" th:field="*{nome}" class="form-control"
                                   th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'"
                                   placeholder="Ex.: Vila Esperança">
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="zona" class="form-label fw-semibold">Zona</label>
                            <select id="zona" th:field="*{zona}" class="form-select"
                                    th:classappend="${#fields.hasErrors('zona')} ? 'is-invalid'">
                                <option value="">Selecione...</option>
                                <option th:each="z : ${zonas}" th:value="${z}" th:text="${z}"></option>
                            </select>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('zona')}" th:errors="*{zona}"></div>
                        </div>

                        <div class="mb-4">
                            <label for="areaKm2" class="form-label fw-semibold">Área (km²)</label>
                            <input type="number" step="0.01" id="areaKm2" th:field="*{areaKm2}" class="form-control"
                                   th:classappend="${#fields.hasErrors('areaKm2')} ? 'is-invalid'"
                                   placeholder="Ex.: 12.50">
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('areaKm2')}" th:errors="*{areaKm2}"></div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Salvar</button>
                            <a th:href="@{/bairros}" class="btn btn-outline-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
